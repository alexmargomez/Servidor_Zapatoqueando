services:
  zapatoqueando-db:
    image: postgres:15-alpine
    container_name: zapatoqueando-db
    restart: unless-stopped
    env_file:
      - .env
    command: -p ${POSTGRES_PORT:-5432}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-zapatoqueando}
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p $${POSTGRES_PORT:-5432} -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-zapatoqueando}"]
      interval: 3s
      timeout: 3s
      retries: 15

  zapatoqueando-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: zapatoqueando-server:latest
    container_name: zapatoqueando-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password123}
      - POSTGRES_DB=${POSTGRES_DB:-zapatoqueando}
      - POSTGRES_HOST=${POSTGRES_HOST:-zapatoqueando-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./src:/usr/src/app/src
      - ./public/assets:/usr/src/app/public/assets
      - ./public/index.html:/usr/src/app/public/index.html
      - uploads_data:/usr/src/app/public/uploads
      - ./public/map-cache:/usr/src/app/public/map-cache
    depends_on:
      zapatoqueando-db:
        condition: service_healthy

volumes:
  pgdata:
  uploads_data:
