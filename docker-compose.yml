version: '3.8'

services:
  zapatoqueando-server:
    build: 
      context: ./Servidor_Zapatoqueando
      dockerfile: Dockerfile
    image: zapatoqueando-server:latest
    container_name: zapatoqueando-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Mount SQLite database file to persist data across container restarts
      - ./Servidor_Zapatoqueando/zapatoqueando.sqlite:/usr/src/app/zapatoqueando.sqlite
