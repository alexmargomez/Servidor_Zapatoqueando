version: '3.8'

services:
  zapatoqueando-db:
    image: postgres:15-alpine
    container_name: zapatoqueando-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: zapatoqueando
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  zapatoqueando-server:
    build: 
      context: .
      dockerfile: Dockerfile
    image: zapatoqueando-server:latest
    container_name: zapatoqueando-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://admin:password123@zapatoqueando-db:5432/zapatoqueando
    depends_on:
      - zapatoqueando-db

volumes:
  pgdata:
